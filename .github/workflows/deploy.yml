name: Java Banking Dashboard application
on:
  push:
    branches:
      - main
jobs:
   checkout:
     name: checkout
     runs-on: ubuntu-latest
     steps:
      - name: checkout code 
        uses: actions/checkout@v6.1.0

      - name: Setup java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: check java version
        run: java --version

      - name: Build
        run: mvn clean package -DskipTests
