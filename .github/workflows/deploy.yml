name: Java Banking Dashboard application

on:
  push:
    branches:
      - main

jobs:

  # 1. Build Job
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Check Java version
        run: java --version

      - name: Build and Test
        run: mvn clean verify


  # 2. SonarQube Job
  sonarqube:
    name: SonarQube Analysis
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: SonarQube Analysis and Quality Gate
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=java-project \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true


  # 3. Nexus Job
  nexus:
    name: Publish JAR to Nexus
    needs: sonarqube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus-releases</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish JAR to Nexus
        run: mvn deploy


  # 4. Docker + Trivy Job
  docker-security:
    name: Docker Build and Trivy Scan
    needs: nexus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Download JAR from Nexus
        run: |
          curl -f -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            -o java-build-dashboard.jar \
            "http://13.232.209.135:8081/repository/maven-releases-java-project/com/example/java-build-dashboard/1.0.0/java-build-dashboard-1.0.0.jar"

      - name: Verify JAR
        run: |
          ls -lh java-build-dashboard.jar

      - name: Build Docker image
        run: |
          docker build -t java-build-dashboard:${{ github.sha }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: java-build-dashboard:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
