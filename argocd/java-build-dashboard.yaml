apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-build-dashboard
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/veeravenkateswararao/Java-project.git
    targetRevision: main
    path: java-build-dashboard

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true